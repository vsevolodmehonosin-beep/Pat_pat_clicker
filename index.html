<html>
<head>
    <title>PatPat Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>PatPat Clicker</h1>

    <div id="cat-container" class="cat_container"> <!--Cat image, circle, button-->
        <button onclick="pat_button()" class="pat_button"><img class="cat" src="cat.png" alt="cat">
            <div class="orbit_auto_clicks" id="auto_clicks"><img src="cursor_pat.png" class="cursor_auto_clicks"></div>
        </button>
    </div>

    <div> <!--stats-->
        <p>PatPats: <span id="patpat_count">0</span></p>
        <p>Bonuss clicks: <span id="bonuss_clicks">0</span></p>
        <p>Multiplier: <span id="multiplier">1</span></p>
        <p>Auto clicks: <span id="auto_clicks_count">0</span></p>
    </div>

    <div> <!--Buttons/upgrades-->
        <button onclick="upgrade_double_clicks()" id="upgrade-button" class="upgrade_button">Upgrade, +1 pat per click (Cost: <span id="upgrade-cost">10</span> patpats)</button>
        <button onclick="upgrade_plus_1_2_clicks()" id="upgrade_plus_1_2_clicks" class="upgrade_button">Upgrade, *1.2 pat per click (Cost: <span id="upgrade_plus_1_2_clicks_cost">400</span> patpats)</button>
        <button onclick="auto_click()" id="auto_click_button" class="upgrade_button">Upgrade, +1 auto click every second (Cost: <span id="auto-click-cost">1000</span> patpats)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
